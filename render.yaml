services:
  # Backend: standalone Hono API + Prisma against Supabase Postgres
  - type: web
    name: expense-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w @expense/api
    startCommand: npm run migrate -w @expense/api && npm start -w @expense/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # Must list the deployed web origin, e.g. https://expense-web.onrender.com
      - key: CORS_ORIGINS
        sync: false

  # Frontend: Next.js SSR, calls the API over HTTP
  - type: web
    name: expense-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w @expense/web
    startCommand: npm start -w @expense/web
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: expense-api
          type: web
          property: hostport
