services:
  # Backend: standalone Hono API talking to Supabase via supabase-js
  - type: web
    name: expense-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w @expense/backend
    startCommand: npm start -w @expense/backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Must list the deployed web origin, e.g. https://expense-web.onrender.com
      - key: CORS_ORIGINS
        sync: false

  # Frontend: Next.js SSR, calls the API over HTTP
  - type: web
    name: expense-web
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build -w @expense/frontend
    startCommand: npm start -w @expense/frontend
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: expense-api
          type: web
          property: hostport
